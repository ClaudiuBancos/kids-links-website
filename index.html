<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancos Kids' Links</title>
    <!-- Root-absolute paths, so they still load at /luke and the other pages -->
    <link rel="stylesheet" href="/index.css">
    <!-- One pinned copy of each library, shared by every module via bare imports -->
    <script type="importmap">
    {
        "imports": {
            "preact": "https://esm.sh/preact@10.24.3",
            "preact/hooks": "https://esm.sh/preact@10.24.3/hooks",
            "htm": "https://esm.sh/htm@3.1.1",
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.117.3"
        }
    }
    </script>
</head>
<body>
<div id="app"></div>

<script type="module">
    import { h, render } from 'preact';
    import htm from 'htm';
    import App from '/App.js';

    const html = htm.bind(h);
    render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
